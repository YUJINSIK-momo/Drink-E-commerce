# Render 무료 배포 설정 (Blueprint)
# Render 대시보드에서 New + → Blueprint → 이 저장소 선택 시 자동 인식.
# DATABASE_URL 은 Neon/Supabase 값을 대시보드 환경변수에 직접 넣는다.
services:
  - type: web
    name: drink-ecommerce-api
    runtime: node
    rootDir: server
    plan: free
    # --include=dev: Render는 빌드 시 NODE_ENV=production이라 devDeps(nest cli·ts-node)를
    #   빼버린다. 빌드에 필요하므로 강제로 포함시킨다.
    # migrate deploy → 테이블 생성, seed → 상품 7종(멱등 upsert)
    buildCommand: npm install --include=dev && npm run build && npx prisma migrate deploy && npm run seed
    startCommand: node dist/main
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://yujinsik-momo.github.io
