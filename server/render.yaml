# Render 무료 배포 설정 (Blueprint)
# Render 대시보드에서 New + → Blueprint → 이 저장소 선택 시 자동 인식.
# DATABASE_URL 은 Neon/Supabase 값을 대시보드 환경변수에 직접 넣는다.
services:
  - type: web
    name: drink-ecommerce-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: node dist/main
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://yujinsik-momo.github.io
